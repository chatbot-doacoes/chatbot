<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Instituições</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <h1>Instituições</h1>

      <hr />

      <h3>Nova Instituição</h3>

      <form id="institutionForm">
        <div class="mb-3">
          <label class="form-label"> Nome </label>

          <input id="institutionName" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label"> Key Hash </label>

          <input id="keyHash" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>
      </form>

      <hr />

      <h3>Instituições Cadastradas</h3>

      <table class="table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="institutionsTable"></tbody>
      </table>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/institutions.js"></script>
  </body>
</html>
